<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f5f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Violin Ear Trainer">
    <title>Violin Ear Trainer</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <div class="header-top">
                <div class="header-spacer"></div>
                <h1 id="appTitle">Violin Ear Trainer</h1>
                <label class="language-picker" for="languageSelect">
                    <span id="languageLabel">Language</span>
                    <select id="languageSelect" aria-label="Language">
                        <option value="en">English</option>
                        <option value="de">Deutsch</option>
                        <option value="ja">&#26085;&#26412;&#35486;</option>
                        <option value="it">Italiano</option>
                        <option value="el">&#917;&#955;&#955;&#951;&#957;&#953;&#954;&#940;</option>
                        <option value="zh-TW">&#32321;&#39636;&#20013;&#25991;</option>
                    </select>
                </label>
            </div>
            <p id="status" class="status">Loading violin samples...</p>
        </header>

        <section class="settings-card">
            <div class="settings-grid">
                <label>
                    <span id="fromLabel">From</span>
                    <select id="startNote"></select>
                </label>
                <label>
                    <span id="toLabel">To</span>
                    <select id="endNote"></select>
                </label>
                <label>
                    <span id="keyLabel">Key</span>
                    <select id="keySelect"></select>
                </label>
                <label>
                    <span id="clefLabel">Clef</span>
                    <select id="clefSelect">
                        <option value="Treble">Treble</option>
                        <option value="Bass">Bass</option>
                        <option value="Auto">Auto</option>
                    </select>
                </label>
            </div>
            <div class="settings-actions">
                <!-- Internal fixed instrument, not a selector; this is a separate violin-only app. -->
                <select id="instrumentSelect" hidden aria-hidden="true" tabindex="-1"><option value="violin">Violin</option></select>
                <label class="mode-picker" for="modeSelect">
                    <span id="modeLabel">Mode</span>
                    <select id="modeSelect">
                        <option value="single">Single note</option>
                        <option value="interval">Two notes</option>
                        <option value="ap">Absolute pitch</option>
                        <option value="apLearn">AP learning</option>
                        <option value="apCold">AP cold check</option>
                    </select>
                </label>
                <button id="applyButton" class="secondary" disabled>Apply</button>
                <div class="interval-settings" id="intervalPicker" hidden>
                    <label class="interval-picker" for="minIntervalSelect">
                        <span id="minIntervalLabel">Min interval (semitones)</span>
                        <select id="minIntervalSelect" aria-labelledby="minIntervalLabel"></select>
                    </label>
                    <label class="interval-picker" for="maxIntervalSelect">
                        <span id="maxIntervalLabel">Max interval (semitones)</span>
                        <select id="maxIntervalSelect" aria-labelledby="maxIntervalLabel"></select>
                    </label>
                    <label class="interval-picker" for="directionSelect">
                        <span id="targetDirectionLabel">Target direction</span>
                        <select id="directionSelect" aria-labelledby="targetDirectionLabel">
                            <option value="higher">Higher</option>
                            <option value="lower">Lower</option>
                            <option value="both">Both (random)</option>
                        </select>
                    </label>
                </div>
                <div class="ap-settings" id="apPicker" hidden>
                    <div id="apAssessmentOptions" class="ap-configuration">
                    <label class="ap-picker" for="apTrialsSelect">
                        <span id="apTrialsLabel">Questions per round</span>
                        <select id="apTrialsSelect"><option value="12">12</option><option value="20">20</option><option value="36">36</option><option value="48">48</option></select>
                    </label>
                    <label class="ap-picker" for="apTimeSelect">
                        <span id="apTimeLabel">Response limit</span>
                        <select id="apTimeSelect"><option value="5">5 seconds</option><option value="2">2 seconds</option><option value="none">No limit</option></select>
                    </label>
                    </div>
                    <div class="ap-course-info" id="apCourseInfo" hidden>
                        <p id="apCourseLevel"></p>
                        <p id="apCourseDescription"></p>
                        <div id="apColdConfirmation" class="ap-cold-confirm" hidden>
                            <p class="ap-description" id="apColdRangeText"></p>
                            <label class="ap-opt"><input id="apColdCheck" type="checkbox"><span id="apColdConfirmText"></span></label>
                            <label class="ap-opt"><input id="apColdMusicCheck" type="checkbox"><span id="apColdMusicText"></span></label>
                            <label class="ap-picker" for="apColdDevice"><span id="apColdDeviceLabel"></span>
                                <select id="apColdDevice"><option value="speaker">Speaker</option><option value="wired">Wired headphones</option><option value="bluetooth">Bluetooth</option><option value="other">Other/unknown</option></select>
                            </label>
                            <label class="ap-opt"><input id="apHideColdCheck" type="checkbox"><span id="apHideColdText"></span></label>
                        </div>
                        <label class="ap-opt" id="apResetOption" hidden><input id="apResetCheck" type="checkbox"><span id="apResetText"></span></label>
                    </div>
                    <p id="apDescription" class="ap-description">No feedback until the round ends · jumps over 1 octave · answer by note name</p>
                </div>
            </div>
        </section>

        <section class="controls">
            <button id="playButton" class="primary" disabled>Play</button>
            <button id="nextButton" class="secondary" disabled>Next</button>
            <button id="demoButton" class="secondary" disabled>Demo</button>
        </section>

        <section class="ap-answer-panel" id="apAnswerPanel" hidden>
            <div id="apAnswers" class="ap-answer-buttons" aria-label="Absolute pitch answers"></div>
            <div id="apReview" class="ap-review" hidden></div>
        </section>

        <details class="ap-history-panel" id="apHistoryPanel">
            <summary id="apProgressTitle">AP progress</summary>
            <div id="apRecentHistory"></div>
            <button type="button" class="secondary" id="apExportButton">Export trial CSV</button>
        </details>

        <section class="tracker-strip" aria-label="Training time">
            <p id="trackerStatus">今日有效训练 0/60 分钟 · 仅本机，未同步</p>
            <details class="tracker-config">
                <summary><span id="trackerSettingTitle">训练时间同步设置</span> <span id="trackerSync"></span></summary>
                <label><span id="trackerEndpointLabel">Cloudflare 同步 Worker HTTPS 地址</span>
                    <input id="trackerEndpoint" type="url" placeholder="https://your-sync-worker.workers.dev" autocomplete="off">
                </label>
                <label><span id="trackerKeyLabel">个人配对码（不同网站和设备须完全相同）</span>
                    <input id="trackerKey" type="text" maxlength="32" autocomplete="off" spellcheck="false">
                </label>
                <div class="tracker-buttons">
                    <button type="button" id="trackerSave" class="secondary">保存同步设置</button>
                    <button type="button" id="trackerCopy" class="secondary">复制配对码</button>
                </div>
                <div id="trackerHistory" class="tracker-history"></div>
                <p id="trackerConfigMessage">未配置云端前，两个网站与设备的进度不能合并。</p>
            </details>
        </section>

        <section class="answer-card">
            <div id="answerText" class="answer-text">Free play mode</div>
            <svg id="staff" viewBox="0 0 800 185" role="img" aria-label="Music staff"></svg>
        </section>

        <section class="keyboard-card">
            <nav id="octaveNav" class="octave-nav" aria-label="Octave navigation" hidden></nav>
            <div id="keyboardScroller" class="keyboard-scroller">
                <div id="keyboard" class="keyboard"></div>
            </div>
        </section>
        <p id="helpText" class="hint"></p>
    </main>

    <script src="https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js"></script>
    <script src="./i18n.js"></script>
    <script src="./demo-score.js"></script>
    <script src="./ap-science.js"></script>
    <script src="./training-tracker.js"></script>
    <script src="./app.js"></script>
</body>
</html>
