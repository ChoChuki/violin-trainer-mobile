<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f5f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Violin Ear Trainer">
    <title>Violin Ear Trainer</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <div class="header-top">
                <div class="header-spacer"></div>
                <h1 id="appTitle">Violin Ear Trainer</h1>
                <label class="language-picker" for="languageSelect">
                    <span id="languageLabel">Language</span>
                    <select id="languageSelect" aria-label="Language">
                        <option value="en">English</option>
                        <option value="de">Deutsch</option>
                        <option value="ja">&#26085;&#26412;&#35486;</option>
                        <option value="it">Italiano</option>
                        <option value="el">&#917;&#955;&#955;&#951;&#957;&#953;&#954;&#940;</option>
                        <option value="zh-TW">&#32321;&#39636;&#20013;&#25991;</option>
                    </select>
                </label>
            </div>
            <p id="status" class="status">Loading violin samples...</p>
        </header>

        <section class="settings-card">
            <div class="settings-grid">
                <label>
                    <span id="fromLabel">From</span>
                    <select id="startNote"></select>
                </label>
                <label>
                    <span id="toLabel">To</span>
                    <select id="endNote"></select>
                </label>
                <label>
                    <span id="keyLabel">Key</span>
                    <select id="keySelect"></select>
                </label>
                <label>
                    <span id="clefLabel">Clef</span>
                    <select id="clefSelect">
                        <option value="Treble">Treble</option>
                        <option value="Bass">Bass</option>
                        <option value="Auto">Auto</option>
                    </select>
                </label>
            </div>
            <div class="settings-actions">
                <!-- Internal fixed instrument, not a selector; this is a separate violin-only app. -->
                <select id="instrumentSelect" hidden aria-hidden="true" tabindex="-1"><option value="violin">Violin</option></select>
                <label class="mode-picker" for="modeSelect">
                    <span id="modeLabel">Mode</span>
                    <select id="modeSelect">
                        <option value="single">Single note</option>
                        <option value="interval">Two notes</option>
                    </select>
                </label>
                <button id="applyButton" class="secondary" disabled>Apply</button>
            </div>
        </section>

        <section class="controls">
            <button id="playButton" class="primary" disabled>Play</button>
            <button id="nextButton" class="secondary" disabled>Next</button>
            <button id="demoButton" class="secondary" disabled>Demo</button>
        </section>

        <section class="answer-card">
            <div id="answerText" class="answer-text">Free play mode</div>
            <svg id="staff" viewBox="0 0 800 185" role="img" aria-label="Music staff"></svg>
        </section>

        <section class="keyboard-card">
            <nav id="octaveNav" class="octave-nav" aria-label="Octave navigation" hidden></nav>
            <div id="keyboardScroller" class="keyboard-scroller">
                <div id="keyboard" class="keyboard"></div>
            </div>
        </section>
        <p id="helpText" class="hint"></p>
    </main>

    <script src="https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js"></script>
    <script src="./i18n.js"></script>
    <script src="./demo-score.js"></script>
    <script src="./app.js"></script>
</body>
</html>
